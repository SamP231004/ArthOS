# Render's free plan puts the backend to sleep after ~15 minutes without traffic, and waking it takes 30–60 s:
# that's what made "Try the demo" (or any first visit) hang. Pinging the health check every 10 minutes keeps it awake.
# One always-on free service uses ~744 of Render's 750 free instance hours a month.
# Note: GitHub pauses scheduled workflows in repos with no activity for 60 days; any push re-enables them.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://arthos-9tro.onrender.com/api/health
