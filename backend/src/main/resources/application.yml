server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 2048

spring:
  application:
    name: arthos-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/arthos}
      # Explicit DB name so Atlas URIs without a path (".../?retryWrites=true") still work.
      database: ${MONGODB_DATABASE:arthos}
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

arthos:
  jwt:
    # Must be at least 32 characters. Always override in production.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiry-hours: ${JWT_EXPIRY_HOURS:168}
  google:
    # OAuth 2.0 Web client ID from Google Cloud Console. Empty = Google sign-in disabled.
    client-id: ${GOOGLE_CLIENT_ID:}
    # Optional extra accepted audiences, comma-separated (e.g. the Android client ID).
    extra-client-ids: ${GOOGLE_EXTRA_CLIENT_IDS:}
  cors:
    # Comma-separated list. Supports patterns like https://*.vercel.app
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:19006}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
