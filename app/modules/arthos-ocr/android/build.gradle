apply plugin: 'com.android.library'

group = 'expo.modules.arthosocr'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

buildscript {
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }
}

android {
  namespace "expo.modules.arthosocr"
  compileSdkVersion safeExtGet("compileSdkVersion", 36)
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
    versionCode 1
    versionName "1.0.0"
    // ML Kit finds its parts by class name at runtime; keep them through the app's release minification (R8)
    consumerProguardFiles "consumer-rules.pro"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Bundled model: shipped inside the APK, works offline and without waiting for Google Play services to download it.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  // On-device PDF text (password-protected CAS statements) for broker/CAS import
  implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
