# Builds the Android APK on GitHub's runners and publishes it as the "Android app (latest)" release, so the newest
# build can be downloaded straight to a phone from:
#   https://github.com/SamP231004/ArthOS/releases/tag/android-latest
#
# It runs EAS Build *locally on the runner* (`eas build --local`): the app is signed with the same keystore EAS
# manages (the one whose SHA-1 is registered for Google sign-in), but no EAS cloud build minutes are used.
# Needs one repository secret: EXPO_TOKEN (expo.dev → Account settings → Access tokens).
name: Android APK

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write # to create/update the release

env:
  # Gradle version used by the Expo SDK's Android template (see android/gradle/wrapper after prebuild)
  GRADLE_VERSION: "9.4.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME); the setup-android action fails on its retired
      # "tools" package, so it isn't used.
      - name: Check EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN repository secret (expo.dev → Account settings → Access tokens), then re-run this workflow."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # services.gradle.org sometimes answers 504 / times out. Fetch the Gradle distribution once with patient retries,
      # check its official checksum, cache it, and point the build at the local file (app/plugins/with-local-gradle.js).
      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/gradle-dist
          key: gradle-dist-${{ env.GRADLE_VERSION }}

      - name: Fetch Gradle distribution (with retries)
        continue-on-error: true
        run: |
          f="$HOME/gradle-dist/gradle-${GRADLE_VERSION}-bin.zip"
          if [ ! -f "$f" ]; then
            mkdir -p "$HOME/gradle-dist"
            base="https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
            curl -fL --retry 10 --retry-delay 20 --retry-all-errors --connect-timeout 20 -o "$f" "$base"
            sum=$(curl -fsL --retry 10 --retry-delay 20 --retry-all-errors "$base.sha256")
            echo "$sum  $f" | sha256sum -c - || { rm -f "$f"; exit 1; }
          fi
          echo "GRADLE_DIST_FILE=$f" >> "$GITHUB_ENV"

      - name: Build APK (EAS, on this runner)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2
          # arm64 only: what virtually every Android phone from the last ~8 years runs; halves the APK and build time
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
        # One automatic retry: the runner sometimes times out downloading Gradle or Maven artifacts before any of
        # our code compiles. A real compile error fails both attempts the same way.
        run: |
          for attempt in 1 2; do
            if npx --yes eas-cli@latest build --platform android --profile preview --local --non-interactive --output "$GITHUB_WORKSPACE/ArthOS.apk"; then
              exit 0
            fi
            echo "::warning::Build attempt $attempt failed"
            [ "$attempt" = 1 ] && sleep 30
          done
          exit 1

      - name: Publish "Android app (latest)" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android app (latest)
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Latest ArthOS Android build from `${{ github.sha }}`.

            Open this page on your phone and tap **ArthOS.apk** to download and install it
            (allow "Install unknown apps" for your browser the first time).
          files: ArthOS.apk
          fail_on_unmatched_files: true

      - name: Keep the APK as a workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: ArthOS-apk
          path: ${{ github.workspace }}/ArthOS.apk
          retention-days: 14
